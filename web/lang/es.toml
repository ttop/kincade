# Kincade web page language file: Spanish.
#
# This file holds the browser page's own wording, with the same keys as
# web/lang/en.toml (see that file for what each table and key words). It
# addresses the reader as formal ("usted").

[page]
title = "Kincade — Árboles genealógicos"
tagline = "Cree en PDF un árbol de antepasados o un árbol en abanico a partir de un archivo GEDCOM"
version = "Versión {version}"
language = "Idioma de la página"
languageName = "Español"
privacy = "Su archivo GEDCOM se lee en este navegador y nunca se envía a ningún servidor."

[status]
loading = "Cargando Kincade…"
ready = "Listo"
retry = "Reintentar"

[step]
pyodide = "Cargando Pyodide"
micropip = "Cargando micropip"
reportlab = "Instalando reportlab"
kincade = "Instalando Kincade"
fonts = "Cargando fuentes"
start = "Iniciando Kincade"

[host]
site = "este sitio"
browser = "navegador"

[init]
failed = "{step}: error ({host}): {message}"
downloadHint = "Vuelva a cargar la página. Si la descarga sigue fallando, comunique esta URL al responsable del sitio."

[error]
download = "No se pudo descargar {url}: HTTP {status}"
