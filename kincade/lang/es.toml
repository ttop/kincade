# Kincade language file: Spanish (uv run kincade FILE.ged --root ... --lang es).
#
# Every text key of lang/en.toml is translated here. Keep placeholder names exactly:
# {n}, {pos}, {chart}, {date}, {day}, {month}, {year}, {birth}, {death}, {years},
# {title}, {name}, {page}, {pages}, {id}, {y}. Only templated keys allow braces; write a
# literal brace doubled ({{ or }}). Box labels share a line with their values, so
# keep them short.
#
# Wording follows Spanish genealogical usage: "Árbol de antepasados" for a pedigree
# chart, "cuadro" for each sheet, n./matr./f. (nacimiento, matrimonio, fallecimiento)
# for born/married/died, "en" before every place, lower-case month abbreviations as the
# RAE writes them, and words and abbreviations that do not change with a person's sex.

# Base pedigree title. --title overrides the printed heading.
title = "Árbol de antepasados"

# Name for a living person when --exclude-private is enabled.
living_name = "Persona viva"

# Fan page title. {name} is the center person's name.
fan_title = "{name} — Árbol en abanico"

# Default pedigree heading and PDF Title metadata.
meta_title = "{title} — {name}"

# Footer on every page.
footer = "Creado el {date} con Kincade"

# Footer of the blank chart (--blank): no date.
footer_blank = "Creado con Kincade"

# Full date for the footer and for GEDCOM dates with a day: "3 mar. 1903".
date_format = "{day} {month} {year}"


# Chart label, top right.
chart_label = "Cuadro {n}"

# Line under the header of a continuation chart. n.º is the RAE abbreviation of número.
continuation = "El n.º 1 de este cuadro corresponde al n.º {pos} del cuadro {chart}."

# Line under the header of cuadro 1 when it has continuation charts. An empty string
# leaves it off.
chart_note = "La ascendencia continúa en el cuadro indicado en la última columna."

# Marks text that is cut short to fit its space. One to three characters.
ellipsis = "…"

# Bottom-left page number: {page} of {pages}, counting charts and index pages.
page_number = "Página {page} de {pages}"

# The record ID printed with --show-ids, at the upper right of a box and after the
# name in the index. {id} is the person's record ID without the @ signs. Small black
# type, so keep it short.
record_id = "[{id}]"

# The names of the saved PDFs, before .pdf. {name} is the root person's name.
file_name = "Árbol de antepasados de {name}"
fan_file_name = "Árbol en abanico de {name}"
blank_file_name = "Árbol de antepasados en blanco"

[months]
# January first. The RAE abbreviations, each with a period.
short = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "sept.", "oct.", "nov.", "dic."]

[days]
# Every day prints as its number: "1 mar. 1903".

[index]
# Title of the name index pages.
title = "Índice onomástico"

# One line under the title of the first index page: how to read the numbers after each
# name (cuadro-número: 6-1 is box 1 on cuadro 6). An empty string leaves it off.
legend = "Los números que siguen a cada nombre indican el cuadro y el número dentro de él: 6-1 es el n.º 1 del cuadro 6."

# Where a person is drawn: cuadro-número.
reference = "{chart}-{pos}"

# Birth-year piece of an index entry: n. = nacimiento.
born = "n. {birth}"

# Death-year piece of an index entry: f. = fallecimiento.
died = "f. {death}"

# Between the birth and death pieces.
joiner = ", "

# Wraps both pieces in an index entry: (n. 1850, f. 1920).
years = "({years})"

# The birth-year piece when the year is a christening or baptism (baut. = bautismo).
christened = "baut. {birth}"

# The death-year piece when the year is a burial (sepult. = sepultura, not sep., which
# reads as septiembre) or a cremation.
buried = "sepult. {death}"
cremated = "crem. {death}"

[relationship]
# Relationship note from Tree.parent_relationship, in either parents mode.
# Uses available non-step parents, or the link's non-step relationships when
# neither parent is available. Birth and other relationships give no note. Nouns,
# so the note is the same for a son or a daughter: por adopción, en acogida (foster
# care; bare "acogida" would read as a feminine participle).
adopted = "(por adopción)"
foster = "(en acogida)"

[labels]
# Partner paired with the initial pedigree root's marriage.
spouse = "cónyuge:"
# Box labels, before each value: nacimiento, matrimonio, fallecimiento; each place line
# reads "en …".
birth = "n."
birth_place = "en"
marriage = "matr."
marriage_place = "en"
death = "f."
death_place = "en"

# Stand-ins for a missing birth or death: bautismo (christening or baptism), sepultura
# (burial), cremación.
christening = "baut."
christening_place = "en"
burial = "sepult."
burial_place = "en"
cremation = "crem."
cremation_place = "en"

[dates]
# ABT → hacia, EST → est. (estimada), CAL → calc. (calculada).
about = "hacia"
estimated = "est."
calculated = "calc."
before = "antes de"
after = "después de"
# A FROM date with no TO, and a TO date with no FROM.
from = "desde"
to = "hasta"
# Between the two dates of a range: 1622–1632.
range = "–"

[dates.with_day]
# The words read the same before a day: "antes de 17 ene. 1666".

[dates.rewrite]
# No phrase changes.

[years]
# Fan stand-ins use the box labels: bautismo, sepultura and cremación.
# {y} is the year with any short date word.
christening = "baut. {y}"
burial = "sepult. {y}"
cremation = "crem. {y}"

# A death without a readable year: † is the same for anyone, as fallecido is not.
deceased = "†"

# Short fan year words: h. (hacia: approximate, estimated or calculated, and the first
# year of a range, where entre would read as the span to the death year), ant. (antes:
# before or TO), desp. (después: after or FROM). {y} is the year, including both
# readings of a double year.
about = "h. {y}"
before = "ant. {y}"
after = "desp. {y}"
between = "h. {y}"

[sort]
# The index order of Spanish lists (RAE, Ortografía, alfabetización de antropónimos). ñ
# is a letter of its own, after n: "ñ" = "n~" files Muñoz after Muntaner and before
# Murillo (the "~" sorts after every letter). ch and ll are not letters of their own,
# so they sort as written. The prepositions de and del, and an article after de, are
# skipped when a surname is sorted: "de la Fuente" files under F and "del Río" under R.
# A leading article stays the filing word: "Las Heras" files under L, as do San and
# Santa under S. The skipped particles print in small letters (Lucía de la FUENTE) and,
# in the index, after the given name (FUENTE, Lucía de la). Punctuation is dropped from
# the sort key first, and a hyphen reads as a space, so Ruiz-Mateos files as two
# surnames, among the Ruiz M… entries.
after_z = []
ignore_particles = ["de", "del", "de la", "de las", "de los"]
mc_as_mac = false

[sort.expand]
"ñ" = "n~"
