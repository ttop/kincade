name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Liberation fonts
        if: runner.os == 'Linux'
        run: |
          if ! dpkg -s fonts-liberation >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes fonts-liberation
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
