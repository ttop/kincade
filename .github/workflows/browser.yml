name: Browser acceptance

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: web/.cache/uv
      PLAYWRIGHT_BROWSERS_PATH: web/.cache/browser-tests/browsers
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group browser
      - run: uv run --locked --group browser playwright install --with-deps --no-shell chromium
      - run: uv run --locked --group browser pytest -q web/browser_tests
